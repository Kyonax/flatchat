# SPDX-License-Identifier: MPL-2.0
# Every push and pull request: the harness (the layout check, the agent-skill check, the trap linter,
# lint, types, tests, a headless world server and bots on both transports), then the client built,
# packaged and smoke-tested on Linux and on Windows, each smoke test also joining a world server over
# WebRTC data channels; on Linux, Stage 1's path end to end (the core on PostgreSQL, an invited
# account, sign-in through the browser flow, an approved world on the plaza, joining, walking and
# chat). GitHub's runners are free for public repositories.
# Each job has a time limit, so a hung smoke test fails in minutes instead of GitHub's six hours.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run harness
      # S1.15: 10 bots for 2 minutes on each transport (the harness's own bot check runs 4 s).
      - name: Bots, 10 for 2 minutes on each transport
        run: npm run bots -- smoke --bots 10 --seconds 120
      # S2.09: bots fill a world until it leaves the public list (the core on PostgreSQL, a real world server).
      - name: The world browser, with bots filling a world
        run: node tools/bots/src/browse.ts

  host-tool:
    name: Host tool
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # S2.02: the package a host downloads (with Node.js), then the container image, which checks a world inside it.
      - run: node tools/host-tool/scripts/pack.ts --out release/host
      - name: The package works with no Node.js on the path
        run: |
          mkdir fresh && tar -xzf release/host/flatchat-host-*-linux-x64.tar.gz -C fresh
          env -i HOME="$PWD/fresh" PATH=/usr/bin:/bin fresh/flatchat-host-*/bin/flatchat-host new fresh/w
          env -i HOME="$PWD/fresh" PATH=/usr/bin:/bin fresh/flatchat-host-*/bin/flatchat-host build fresh/w
      - run: node tools/host-tool/scripts/pack.ts --no-node --out release/image
      - run: docker build -t flatchat-host -f tools/host-tool/Dockerfile release/image/flatchat-host-*-linux-x64
      - run: docker run --rm flatchat-host check /flatchat/kits/worlds/plaza
      - uses: actions/upload-artifact@v7
        with:
          name: flatchat-host-linux
          path: release/host/flatchat-host-*-linux-x64.tar.gz
          retention-days: 30

  client-linux:
    name: Client on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run dist:linux -w @flatchat/client
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The runner has no GPU, and Chromium no longer falls back to SwiftShader for WebGL by itself.
      # The client joins a world server on loopback over WebRTC (Chromium's own) as part of its smoke test.
      - name: Smoke test on a virtual display, joining a world server
        run: xvfb-run -a npm run bots -- client-check -- apps/client/release/linux-unpacked/flatchat --smoke --enable-unsafe-swiftshader --smoke-out=smoke-linux.json
      - run: cat smoke-linux.json
      # The runner's PostgreSQL (its programs only; the test runs its own private cluster).
      - name: End to end, sign in, join the plaza, walk and chat
        run: xvfb-run -a node tools/bots/src/e2e.ts apps/client/release/linux-unpacked/flatchat --shot e2e-linux.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-linux
          path: e2e-linux.png
          if-no-files-found: ignore
          retention-days: 7
      # The same build with no way to draw must fail its smoke test, or a blank client could pass.
      - name: Smoke test fails when nothing can draw
        run: |
          if xvfb-run -a apps/client/release/linux-unpacked/flatchat --smoke --disable-gpu --smoke-out=smoke-nodraw.json; then
            echo "::error::the smoke test passed although nothing could draw"
            exit 1
          fi
          cat smoke-nodraw.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux
          path: apps/client/release/linux-unpacked
          retention-days: 7
      # S1.14: what testers download, an AppImage and a .tar.gz, kept for a month.
      - name: Builds for testers
        run: npm run dist:testers -w @flatchat/client
      - uses: actions/upload-artifact@v7
        with:
          name: flatchat-linux
          path: |
            apps/client/release/FlatChat-*.AppImage
            apps/client/release/FlatChat-*.tar.gz
          retention-days: 30

  client-windows:
    name: Client on Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # node-datachannel's Windows binary on a server and its bots, both transports.
      - run: node tools/bots/src/run.ts smoke
      - run: npm run dist:win -w @flatchat/client
      - name: Smoke test, joining a world server
        shell: pwsh
        run: |
          node tools/bots/src/run.ts client-check -- apps/client/release/win-unpacked/FlatChat.exe --smoke --smoke-out=smoke-windows.json
          $code = $LASTEXITCODE
          Get-Content smoke-windows.json
          exit $code
      - uses: actions/upload-artifact@v7
        with:
          name: client-windows
          path: apps/client/release/*.zip
          retention-days: 30
