# SPDX-License-Identifier: MPL-2.0
# Packages the built client (out/) for Linux and Windows. Windows builds from Linux as a zip:
# signing and editing the executable's resources need Wine and wait for the release builds.
# `npm run dist:linux` makes the unpacked folder the smoke tests run; `npm run dist:testers` adds
# what testers download (S1.14): an AppImage (one file, most distributions) and a .tar.gz.
appId: com.kyonax.flatchat
productName: FlatChat
electronVersion: 44.8.0
directories:
  output: release
files:
  - out/**
  - "!out/offline/**"
  - package.json
# Offline mode's built-in worlds (S2.13), outside the archive: the world server reads them as files.
extraResources:
  - from: out/offline
    to: offline
asar: true
# The licences of the bundled third-party code (scripts/notices.mjs), next to the executable.
extraFiles:
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
linux:
  target: dir
  executableName: flatchat
  # The mark on black, written by scripts/make-icon.ts (S6.07).
  icon: out/icon.png
  category: Game
  artifactName: FlatChat-${version}-linux-${arch}.${ext}
win:
  # The portable zip, and the per-user installer (S7.01) the self-update runs silently.
  target:
    - zip
    - nsis
  artifactName: FlatChat-${version}-windows-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  artifactName: FlatChat-${version}-windows-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false
